<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#040404">
    <title>$##%@#</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/cicada.css">
</head>

<body>
    <div class="runas"></div>
    <div class="runas runas--direita"></div>

    <main class="tela">
        <section class="etapa">
            <h1 class="titulo glitch">Sejam bem&#8209;vindos</h1>
            <p class="instrucao" data-decrypt>Descubra a combinação correta de cores.</p>

            <div class="cores" role="group" aria-label="Cores">
                <button class="cor" type="button" data-cor="red" aria-label="Vermelho" aria-pressed="false"></button>
                <button class="cor" type="button" data-cor="blue" aria-label="Azul" aria-pressed="false"></button>
                <button class="cor" type="button" data-cor="green" aria-label="Verde" aria-pressed="false"></button>
            </div>

            <div class="progresso" aria-hidden="true"><span></span><span></span><span></span></div>
            <p class="mensagem" id="msg-oculta" aria-live="polite"></p>
            <a href="pag-transicao.html" class="acao" id="link-oculto" data-transicao hidden>
                <span>[ continuar para a segunda parte ]</span>
            </a>
        </section>
    </main>

    <script src="assets/cicada.js"></script>
    <script>
        const cores = document.querySelectorAll('.cor');
        const marcas = document.querySelectorAll('.progresso span');
        const linkOculto = document.getElementById('link-oculto');
        const msg = document.getElementById('msg-oculta');
        const coresCorretas = ["red", "green", "blue"];
        let selecaoAtual = 0;

        fx.decifra(document.querySelector('.instrucao'), 1900);

        const marca = () => marcas.forEach((m, i) => m.classList.toggle('on', i < selecaoAtual));

        cores.forEach((cor) => {
            cor.addEventListener('click', () => {
                if (selecaoAtual === coresCorretas.length) return;

                if (cor.dataset.cor === coresCorretas[selecaoAtual]) {
                    selecaoAtual++;
                    cor.setAttribute('aria-pressed', 'true');
                    msg.textContent = '';
                    msg.classList.remove('mensagem--erro');
                    fx.sfx('tique');
                    marca();

                    if (selecaoAtual === coresCorretas.length) {
                        fx.sfx('ok');
                        fx.surto(2);
                        msg.textContent = 'Sequência aceita.';
                        linkOculto.hidden = false;
                        fx.decifra(linkOculto.querySelector('span'), 900);
                        linkOculto.focus();
                    }
                } else {
                    selecaoAtual = 0;
                    cores.forEach((c) => c.setAttribute('aria-pressed', 'false'));
                    marca();
                    msg.textContent = 'Sequência inválida. Recomece.';
                    msg.classList.add('mensagem--erro');
                    fx.sfx('erro');
                    fx.surto(2);
                }
            });
        });
    </script>
</body>

</html>
